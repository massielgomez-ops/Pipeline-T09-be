name: DockerHub CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions UI

jobs:
  docker-build-push:
    name: Build & Push Docker Image to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_NOMBRE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-massiel/Dockerfile
          push: true
          tags: |
            massielgomezpinto/pipeline-t09-be:latest
            massielgomezpinto/pipeline-t09-be:${{ github.sha }}

      - name: Pipeline Finished
        run: echo "Docker image pushed to massielgomezpinto/pipeline-t09-be successfully"
